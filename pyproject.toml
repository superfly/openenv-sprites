[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openenv-sprites"
version = "0.2.0"
description = "An experimental OpenEnv runtime provider backed by Fly.io Sprites"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = [
    "agents",
    "huggingface",
    "openenv",
    "remote-execution",
    "sandbox",
    "sprites",
]
authors = [
    {name = "Sprites Team"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "openenv>=0.4.1",
    "sprites-py>=0.5.0",
    "websockets>=15.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.14.0",
    "twine>=6.0",
]

[project.urls]
Homepage = "https://sprites.dev"
Documentation = "https://github.com/superfly/openenv-sprites#readme"
Repository = "https://github.com/superfly/openenv-sprites"
Issues = "https://github.com/superfly/openenv-sprites/issues"
Changelog = "https://github.com/superfly/openenv-sprites/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/openenv_sprites"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
